name: 一键生成 APK（无需 Expo 账号）
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/android-apk.yml"
      - "scripts/android/**"
      - "app/**"
      - "src/**"
      - "assets/**"
      - "app.json"
      - "app.config.ts"
      - "package.json"
      - "package-lock.json"
permissions:
  contents: read
concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      CI: "1"
      EXPO_OFFLINE: "1"
      ANDROID_VERSION_CODE: ${{ github.run_number }}
      CMAKE_BUILD_PARALLEL_LEVEL: "2"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: package-lock.json
      - name: 检查 GitHub 云端 Android SDK
        shell: bash
        run: |
          test -d "$ANDROID_HOME" || { echo '当前 runner 缺少 Android SDK'; exit 1; }
          java -version
      - run: npm ci
      - run: npm run check
      - name: 自动选择签名（未配置时直接生成体验版）
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: node scripts/android/prepare-signing.mjs
      - name: 直接编译独立 APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: npm run build:apk
      - name: 验证安装包签名与离线资源
        run: bash scripts/android/verify-apk.sh
      - name: 上传 APK（在本次运行的 Artifacts 下载）
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: my-calendar-${{ env.APK_VARIANT }}-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: 下载说明
        shell: bash
        run: |
          {
            echo '## APK 已生成'
            echo '回到本次运行 Summary 页面，在 Artifacts 下载 my-calendar 开头的压缩包。'
            echo '解压后将 .apk 发到安卓手机安装；无需 Expo Go 或开发服务器。'
            if [ "$APK_VARIANT" = preview ]; then
              echo '本次为零配置体验版：独立包名，使用公开测试签名；请勿作为正式分发签名。'
            else
              echo '本次使用你在仓库安全设置中提供的私有正式签名。'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: 清理临时私钥
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/my-calendar-signing.keystore"
